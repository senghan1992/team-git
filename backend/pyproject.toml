[project]
name = "gc-peer-backend"
version = "0.1.0"
description = "Git Companion peer notification backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 패키지는 `app` 하나뿐이다 — 자동 탐색에 맡기면 옆에 생긴 폴더(빌드 산출물 등)
# 때문에 "Multiple top-level packages" 로 설치가 멈출 수 있어 명시한다.
[tool.setuptools]
packages = ["app", "app.routes"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
